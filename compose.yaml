name: cheddar-demo
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: cheddar_demo
      POSTGRES_PASSWORD: cheddar_demo_local
      POSTGRES_DB: cheddar_demo
    volumes:
      - demo-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cheddar_demo -d cheddar_demo"]
      interval: 3s
      timeout: 3s
      retries: 30
  plugin:
    build:
      context: .
      dockerfile: demo/Dockerfile
      target: plugin
    volumes:
      - ./demo/figma-plugin:/output
  api:
    build:
      context: .
      dockerfile: demo/Dockerfile
      target: api
    environment:
      CHEDDAR_DEMO: "true"
    volumes:
      - type: bind
        source: ./apps/api/.env.local
        target: /run/cheddar/source.env
        read_only: true
        bind:
          create_host_path: false
      - demo-files:/data/files
    ports:
      - "127.0.0.1:3101:3101"
    depends_on:
      db:
        condition: service_healthy
      plugin:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3101/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
  web:
    build:
      context: .
      dockerfile: demo/Dockerfile
      target: web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  demo-db:
  demo-files:
