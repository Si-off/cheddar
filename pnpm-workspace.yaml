packages:
  - apps/api
  - apps/web
  - apps/figma-plugin
  - packages/*

engineStrict: true
saveExact: true
pmOnFail: error
runtimeOnFail: error
allowBuilds:
  '@google/genai': false
  protobufjs: false
  '@scarf/scarf': false
  '@tailwindcss/oxide': true
  esbuild: true
minimumReleaseAgeExclude:
  - react-dom@19.3.1
  - react@19.3.1
